    <text class="header-text" x="18" y="25">USERS</text>
    <text class="key" x="18" y="68">PK</text><text class="field" x="54" y="68">id BIGINT</text>
  </g>

  <g transform="translate(40 340)">
    <rect class="table" width="320" height="130" rx="10"/>
    <path class="header-external" d="M10 0 H310 A10 10 0 0 1 320 10 V38 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="header-text" x="18" y="25">LEARNING_MATERIALS</text>
    <text class="key" x="18" y="68">PK</text><text class="field" x="54" y="68">id BIGINT</text>
    <line class="divider" x1="18" y1="85" x2="302" y2="85"/>
    <text class="key" x="18" y="112">FK</text><text class="field" x="54" y="112">user_id BIGINT</text>
  </g>

  <g transform="translate(430 140)">
    <rect class="table" width="400" height="190" rx="10"/>
    <path class="header-core" d="M10 0 H390 A10 10 0 0 1 400 10 V38 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="header-text" x="18" y="25">QUIZ_SETS</text>
    <text class="key" x="18" y="65">PK</text><text class="field" x="54" y="65">id BIGINT</text>
    <text class="key" x="18" y="89">UK</text><text class="field" x="54" y="89">public_id VARCHAR(36)</text>
    <line class="divider" x1="18" y1="103" x2="382" y2="103"/>
    <text class="key" x="18" y="126">FK</text><text class="field" x="54" y="126">user_id BIGINT</text>
    <text class="key" x="18" y="150">FK</text><text class="field" x="54" y="150">learning_material_id BIGINT</text>
    <text class="field" x="18" y="174">status GENERATING | READY | FAILED</text>
  </g>

  <g transform="translate(430 430)">
    <rect class="table" width="400" height="310" rx="10"/>
    <path class="header-core" d="M10 0 H390 A10 10 0 0 1 400 10 V38 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="header-text" x="18" y="25">QUIZ_QUESTIONS</text>
    <text class="key" x="18" y="65">PK</text><text class="field" x="54" y="65">id BIGINT</text>
    <text class="key" x="18" y="89">UK</text><text class="field" x="54" y="89">public_id VARCHAR(36)</text>
    <line class="divider" x1="18" y1="103" x2="382" y2="103"/>
    <text class="key" x="18" y="126">FK</text><text class="field" x="54" y="126">quiz_set_id BIGINT</text>
    <text class="field" x="18" y="150">question_number INT</text>
    <text class="field" x="18" y="174">type VARCHAR(32)</text>
    <text class="field" x="18" y="198">topic VARCHAR(255)</text>
    <text class="field" x="18" y="222">prompt TEXT</text>
    <text class="field" x="18" y="246">representative_answer TEXT</text>
    <text class="field" x="18" y="270">explanation TEXT</text>
    <text class="field" x="18" y="294">source_excerpt TEXT</text>
  </g>

  <g transform="translate(430 840)">
    <rect class="table" width="400" height="155" rx="10"/>
    <path class="header-core" d="M10 0 H390 A10 10 0 0 1 400 10 V38 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="header-text" x="18" y="25">SHORT_ANSWER_ACCEPTED_ANSWERS</text>
    <text class="key" x="18" y="65">PK</text><text class="field" x="54" y="65">id BIGINT</text>
    <text class="key" x="18" y="89">FK</text><text class="field" x="54" y="89">question_id BIGINT</text>
    <text class="field" x="18" y="113">answer TEXT</text>
    <text class="field" x="18" y="137">normalized_answer VARCHAR(1000)</text>
  </g>

  <g transform="translate(930 140)">
    <rect class="table" width="600" height="220" rx="10"/>
    <path class="header-result" d="M10 0 H590 A10 10 0 0 1 600 10 V38 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="header-text" x="18" y="25">QUIZ_ATTEMPTS</text>
    <text class="key" x="18" y="65">PK</text><text class="field" x="54" y="65">id BIGINT</text>
    <text class="key" x="18" y="89">UK</text><text class="field" x="54" y="89">public_id VARCHAR(36) · client UUID</text>
    <line class="divider" x1="18" y1="103" x2="582" y2="103"/>
    <text class="key" x="18" y="126">FK</text><text class="field" x="54" y="126">quiz_set_id BIGINT</text>
    <text class="key" x="18" y="150">FK</text><text class="field" x="54" y="150">user_id BIGINT</text>
    <text class="field" x="18" y="174">status VARCHAR(32)</text>
    <text class="field" x="18" y="198">automatic_correct_count / graded_question_count INT</text>
  </g>

  <g transform="translate(930 440)">
    <rect class="table" width="600" height="270" rx="10"/>
    <path class="header-result" d="M10 0 H590 A10 10 0 0 1 600 10 V38 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="header-text" x="18" y="25">QUIZ_QUESTION_RESULTS</text>
    <text class="key" x="18" y="65">PK</text><text class="field" x="54" y="65">id BIGINT</text>
    <text class="key" x="18" y="89">UK</text><text class="field" x="54" y="89">attempt_id + question_id</text>
    <line class="divider" x1="18" y1="103" x2="582" y2="103"/>
    <text class="key" x="18" y="126">FK</text><text class="field" x="54" y="126">attempt_id BIGINT</text>
    <text class="key" x="18" y="150">FK</text><text class="field" x="54" y="150">question_id BIGINT</text>
    <text class="field" x="18" y="174">submitted_answer TEXT</text>
    <text class="field" x="18" y="198">automatic_outcome VARCHAR(16)</text>
    <text class="field" x="18" y="222">user_override_outcome VARCHAR(16)</text>
    <text class="field" x="18" y="246">review_resolved BOOLEAN</text>
  </g>

  <g transform="translate(930 820)">
    <rect class="table" width="600" height="190" rx="10"/>
    <path class="header-review" d="M10 0 H590 A10 10 0 0 1 600 10 V38 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="header-text" x="18" y="25">QUIZ_REVIEW_SESSIONS</text>
    <text class="key" x="18" y="65">PK</text><text class="field" x="54" y="65">id BIGINT</text>
    <text class="key" x="18" y="89">UK</text><text class="field" x="54" y="89">public_id VARCHAR(36)</text>
    <line class="divider" x1="18" y1="103" x2="582" y2="103"/>
    <text class="key" x="18" y="126">FK</text><text class="field" x="54" y="126">user_id BIGINT</text>
    <text class="key" x="18" y="150">FK</text><text class="field" x="54" y="150">source_attempt_id BIGINT</text>
    <text class="field" x="18" y="174">status ACTIVE | COMPLETED</text>
  </g>

  <g transform="translate(930 1110)">
    <rect class="table" width="600" height="225" rx="10"/>
    <path class="header-review" d="M10 0 H590 A10 10 0 0 1 600 10 V38 H0 V10 A10 10 0 0 1 10 0Z"/>
    <text class="header-text" x="18" y="25">REVIEW_SESSION_QUESTIONS</text>
    <text class="key" x="18" y="65">PK</text><text class="field" x="54" y="65">id BIGINT</text>
    <text class="key" x="18" y="89">UK</text><text class="field" x="54" y="89">session_id + question_id</text>
    <line class="divider" x1="18" y1="103" x2="582" y2="103"/>
    <text class="key" x="18" y="126">FK</text><text class="field" x="54" y="126">review_session_id BIGINT</text>
    <text class="key" x="18" y="150">FK</text><text class="field" x="54" y="150">question_id BIGINT</text>
    <text class="field" x="18" y="174">sequence_number INT</text>
    <text class="field" x="18" y="198">status PENDING | RESOLVED | UNRESOLVED</text>
  </g>

  <g transform="translate(40 610)">
    <text class="legend-strong" x="0" y="0">핵심 규칙</text>
    <circle cx="8" cy="34" r="5" fill="#059669"/><text class="legend" x="24" y="39">attempt public_id는 client-generated UUID이며 전역 unique</text>
    <circle cx="8" cy="68" r="5" fill="#059669"/><text class="legend" x="24" y="73">최초 automatic_outcome은 불변, 최신 override만 저장</text>
    <circle cx="8" cy="102" r="5" fill="#d97706"/><text class="legend" x="24" y="107">review session 문항 행 자체가 생성 시점 snapshot</text>
    <circle cx="8" cy="136" r="5" fill="#2563eb"/><text class="legend" x="24" y="141">replay·fingerprint·revision 테이블 없음</text>
  </g>

  <g transform="translate(40 1050)">
    <text class="legend-strong" x="0" y="0">범례</text>
    <rect x="0" y="24" width="18" height="18" rx="3" fill="#475569"/><text class="legend" x="30" y="38">외부 소유 데이터</text>
    <rect x="0" y="56" width="18" height="18" rx="3" fill="#2563eb"/><text class="legend" x="30" y="70">퀴즈 정의</text>
    <rect x="0" y="88" width="18" height="18" rx="3" fill="#059669"/><text class="legend" x="30" y="102">풀이·채점 결과</text>
    <rect x="0" y="120" width="18" height="18" rx="3" fill="#d97706"/><text class="legend" x="30" y="134">복습 스냅샷</text>
    <text class="legend" x="0" y="174">PK primary key · FK foreign key · UK unique key</text>
  </g>

  <text class="subtitle" x="40" y="1560">Source: server/src/main/resources/db/migration/V5__create_quiz_grading.sql · 2026-08-24</text>
