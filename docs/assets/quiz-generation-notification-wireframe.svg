  <circle cx="95" cy="596" r="10" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <path d="M92 596l2 2 4-5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
