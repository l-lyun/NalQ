<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">퀴즈 생성 결과 알림 UX 와이어프레임</title>
  <desc id="desc">다른 화면에서 Snackbar와 종 배지로 알림을 확인하는 모바일 화면과 최신순 알림 페이지를 나란히 보여준다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <style>
      text { font-family: Pretendard, system-ui, sans-serif; fill: #22262b; }
      .label { font-size: 16px; font-weight: 600; }
      .title { font-size: 24px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 12px; fill: #747b84; }
      .muted { fill: #747b84; }
      .line { stroke: #e1e4e8; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#f1f3f5"/>
  <text x="52" y="48" class="label">1. 다른 화면에서 결과 알림</text>
  <text x="438" y="48" class="label">2. 종 또는 ‘알림보기’로 알림함 진입</text>

  <g filter="url(#shadow)">
    <rect x="52" y="74" width="330" height="630" rx="28" fill="#ffffff" stroke="#d9dde2"/>
  </g>
  <rect x="70" y="92" width="42" height="5" rx="3" fill="#e4e7ea"/>
  <rect x="330" y="92" width="24" height="5" rx="3" fill="#e4e7ea"/>
  <text x="76" y="144" font-size="20" font-weight="700">NalQ</text>
  <g transform="translate(324 122)">
    <path d="M0 13c3-2 4-6 4-10a8 8 0 0 1 16 0c0 4 1 8 4 10H0Zm8 4h8" fill="none" stroke="#22262b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="15" y="-9" width="22" height="20" rx="10" fill="#e85d38" stroke="#ffffff" stroke-width="2"/>
    <text x="26" y="5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  </g>
  <line x1="52" y1="166" x2="382" y2="166" class="line"/>
  <text x="76" y="208" font-size="13" font-weight="600" fill="#e85d38">학습</text>
  <text x="76" y="244" font-size="22" font-weight="700">오늘도 이어서</text>
  <text x="76" y="274" font-size="22" font-weight="700">학습해 볼까요?</text>
  <line x1="76" y1="312" x2="358" y2="312" class="line"/>
  <rect x="76" y="330" width="42" height="42" rx="10" fill="#f2f4f6"/>
  <path d="M89 342h16l4 4v14H89zM105 342v5h4" fill="none" stroke="#747b84" stroke-width="1.6"/>
  <text x="132" y="347" class="body" font-weight="600">운영체제 중간고사 정리</text>
  <text x="132" y="369" class="small">마지막 학습 10분 전</text>
  <line x1="76" y1="390" x2="358" y2="390" class="line"/>
  <rect x="76" y="426" width="260" height="10" rx="5" fill="#f0f2f4"/>
  <rect x="76" y="450" width="212" height="10" rx="5" fill="#f0f2f4"/>
  <rect x="76" y="474" width="164" height="10" rx="5" fill="#f0f2f4"/>

  <g filter="url(#shadow)">
    <rect x="66" y="563" width="302" height="66" rx="13" fill="#282b2f"/>
  </g>
  <circle cx="92" cy="596" r="10" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <path d="M89 596l2 2 4-5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="110" y="601" font-size="13" font-weight="600" fill="#ffffff">새 퀴즈 알림이 3개 있어요.</text>
  <text x="344" y="601" text-anchor="end" font-size="13" font-weight="700" fill="#ffffff">알림보기</text>
  <line x1="52" y1="650" x2="382" y2="650" class="line"/>
  <text x="107" y="681" text-anchor="middle" class="small">홈</text>
  <text x="217" y="681" text-anchor="middle" font-size="12" font-weight="700">학습</text>
  <text x="327" y="681" text-anchor="middle" class="small">프로필</text>

  <g filter="url(#shadow)">
    <rect x="428" y="74" width="720" height="630" rx="18" fill="#ffffff"/>
  </g>
  <g transform="translate(458 112)"><path d="M18 0 6 12l12 12M6 12h25" fill="none" stroke="#22262b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="510" y="134" class="title">알림</text>
  <text x="1115" y="132" text-anchor="end" font-size="15" font-weight="700" fill="#e85d38">모두 읽음</text>
  <line x1="458" y1="160" x2="1118" y2="160" class="line"/>

  <rect x="458" y="180" width="660" height="126" rx="8" fill="#fff8f5"/>
  <circle cx="480" cy="208" r="4" fill="#e85d38"/>
  <text x="500" y="212" font-size="16" font-weight="700">퀴즈가 완성됐어요.</text>
  <text x="500" y="241" class="body">운영체제 중간고사 대비 퀴즈</text>
  <text x="500" y="270" class="small">방금 전</text>
  <path d="m1088 230 7 7-7 7" fill="none" stroke="#747b84" stroke-width="1.8"/>
  <line x1="458" y1="306" x2="1118" y2="306" class="line"/>

  <rect x="458" y="307" width="660" height="126" rx="8" fill="#fff8f5"/>
  <circle cx="480" cy="335" r="4" fill="#e85d38"/>
  <text x="500" y="339" font-size="16" font-weight="700">학습자료에서 문제를 만들지 못했어요.</text>
  <text x="500" y="368" class="body">네트워크 기초 개념 정리</text>
  <text x="500" y="397" class="small">8분 전</text>
  <path d="m1088 357 7 7-7 7" fill="none" stroke="#747b84" stroke-width="1.8"/>
  <line x1="458" y1="433" x2="1118" y2="433" class="line"/>

  <text x="500" y="473" font-size="16" font-weight="600">퀴즈가 완성됐어요.</text>
  <text x="500" y="502" class="body">데이터베이스 정규화 연습</text>
  <text x="500" y="531" class="small">어제</text>
  <path d="m1088 484 7 7-7 7" fill="none" stroke="#747b84" stroke-width="1.8"/>
  <line x1="458" y1="559" x2="1118" y2="559" class="line"/>
  <text x="788" y="595" text-anchor="middle" font-size="15" font-weight="700">더보기</text>

  <rect x="458" y="622" width="660" height="58" rx="12" fill="#f3f4f6"/>
  <text x="480" y="647" class="small" font-weight="700">항목 선택</text>
  <text x="480" y="668" class="small">완료 → 내 퀴즈 대상 카드</text>
  <text x="720" y="668" class="small">실패 → 원본 자료의 퀴즈 생성 화면</text>

  <path d="M391 378h25" stroke="#9aa1a9" stroke-width="2" stroke-linecap="round"/>
  <path d="m410 372 7 6-7 6" fill="none" stroke="#9aa1a9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="404" y="356" text-anchor="middle" class="small">명시적 선택</text>
</svg>
