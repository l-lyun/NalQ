  <rect x="713" y="92" width="24" height="5" rx="3" fill="#e4e7ea"/>
  <g transform="translate(458 123)"><path d="M18 0 6 12l12 12M6 12h25" fill="none" stroke="#22262b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
