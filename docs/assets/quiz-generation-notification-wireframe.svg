  <text x="485" y="505" class="small">어제</text>
  <path d="m722 464 6 6-6 6" fill="none" stroke="#747b84" stroke-width="1.7"/>
  <line x1="451" y1="527" x2="749" y2="527" class="line"/>
  <text x="600" y="562" text-anchor="middle" font-size="14" font-weight="700">더보기</text>

  <rect x="451" y="590" width="298" height="88" rx="12" fill="#f3f4f6"/>
  <text x="469" y="615" class="small" font-weight="700">항목 선택</text>
  <text x="469" y="639" class="small">완료 → 내 퀴즈 대상 카드</text>
  <text x="469" y="662" class="small">실패 → 원본 자료의 생성 화면</text>

  <path d="M395 378h27" stroke="#9aa1a9" stroke-width="2" stroke-linecap="round"/>
  <path d="m416 372 7 6-7 6" fill="none" stroke="#9aa1a9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
