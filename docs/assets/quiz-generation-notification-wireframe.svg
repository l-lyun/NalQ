  <text x="135" y="369" class="small">마지막 학습 10분 전</text>
  <line x1="79" y1="390" x2="361" y2="390" class="line"/>
  <rect x="79" y="426" width="260" height="10" rx="5" fill="#f0f2f4"/>
  <rect x="79" y="450" width="212" height="10" rx="5" fill="#f0f2f4"/>
  <rect x="79" y="474" width="164" height="10" rx="5" fill="#f0f2f4"/>
