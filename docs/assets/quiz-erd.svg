<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title description">
  <title id="title">OpenMD Quiz ERD</title>
  <desc id="description">OpenMD quiz database relationships for users, learning materials, quiz sets, questions, attempts, grading results, and review snapshots</desc>
  <defs>
    <style>
      .canvas { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #64748b; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .table { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .header-core { fill: #2563eb; }
      .header-result { fill: #059669; }
      .header-review { fill: #d97706; }
      .header-external { fill: #475569; }
      .header-text { fill: #ffffff; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .field { fill: #334155; font: 400 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .key { fill: #2563eb; font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .divider { stroke: #e2e8f0; stroke-width: 1; }
      .relation { fill: none; stroke: #94a3b8; stroke-width: 2; }
      .relation-label { fill: #475569; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .legend { fill: #475569; font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .legend-strong { fill: #0f172a; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
    <marker id="many" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L10 6 L1 11 M1 6 L10 6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect class="canvas" width="1600" height="1600"/>
  <text class="title" x="40" y="48">OpenMD Quiz ERD</text>
  <text class="subtitle" x="40" y="78">client UUID attempt · latest override · fixed review snapshot</text>

