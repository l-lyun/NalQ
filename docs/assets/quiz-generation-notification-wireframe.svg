    <rect x="15" y="-9" width="22" height="20" rx="10" fill="#e85d38" stroke="#ffffff" stroke-width="2"/>
    <text x="26" y="5" text-anchor="middle" font-size="11" font-weight="700" class="inverse">3</text>
  </g>
  <line x1="55" y1="166" x2="385" y2="166" class="line"/>
