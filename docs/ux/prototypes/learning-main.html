<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NalQ 학습 영역 UX 검토</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --canvas:#eef1f4; --surface:#fff; --quiet:#f2f4f6; --pressed:#e7eaee;
      --text:#191f28; --muted:#6b7684; --subtle:#8b95a1; --line:#e5e8eb;
      --brand:#287cff; --brand-pressed:#1768d9; --brand-text:#fff; --danger:#d93036;
    }
    @media (prefers-color-scheme: dark) {
      :root { --canvas:#111316; --surface:#1b1e22; --quiet:#25292e; --pressed:#30353b;
        --text:#f2f4f6; --muted:#b0b8c1; --subtle:#8b95a1; --line:#343a40;
        --brand:#4593ff; --brand-pressed:#73adff; --brand-text:#08111e; --danger:#ff6b6f; }
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--text); }
    button,input { font:inherit; }
    button,input,a { min-height:44px; }
    :focus-visible { outline:3px solid var(--brand); outline-offset:2px; }
    .prototype { display:grid; justify-items:center; gap:12px; padding:16px; }
    .note { width:min(100%,560px); margin:0; color:var(--muted); font-size:13px; line-height:1.5; }
    .phone { width:min(100%,560px); min-height:760px; display:flex; flex-direction:column;
      overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:20px; }
    main { flex:1; padding:24px 20px 48px; }
    h1,h2,p { margin:0; }
    h1 { font-size:29px; line-height:1.3; }
    h2 { font-size:20px; line-height:1.4; }
    .topbar { min-height:52px; display:grid; grid-template-columns:44px 1fr 44px; align-items:center; }
    .topbar h1 { font-size:22px; text-align:center; }
    .icon-button,.text-button,.row,.disclosure,.secondary,.page-button { border:0; background:transparent; color:inherit; cursor:pointer; }
    .icon-button { width:44px; padding:0; font-size:26px; }
    .section { margin-top:32px; }
    .section:first-of-type { margin-top:24px; }
    .section-head { min-height:44px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .text-button { color:var(--brand); font-weight:700; padding:0 4px; }
    .primary { width:100%; min-height:52px; border:0; border-radius:12px; padding:0 16px;
      background:var(--brand); color:var(--brand-text); font-weight:700; cursor:pointer; }
    .primary:active { background:var(--brand-pressed); }
    .recent { padding:18px; border-radius:16px; background:var(--quiet); }
    .title { font-size:17px; line-height:1.45; font-weight:700; }
    .meta { margin-top:4px; color:var(--muted); font-size:14px; line-height:1.45; }
    .recent-action { width:100%; min-height:64px; margin-top:14px; padding:10px 0 0; border:0; border-top:1px solid var(--line);
      display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px; background:transparent; color:inherit; text-align:left; font-weight:700; cursor:pointer; }
    .chevron { align-self:center; color:var(--subtle); font-size:24px; line-height:1; }
    .list { list-style:none; margin:4px 0 0; padding:0; }
    .row { width:100%; min-height:72px; padding:12px 0; border-bottom:1px solid var(--line);
      display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; text-align:left; }
    .row .title,.row .meta,.disclosure .title,.disclosure .meta { display:block; }
    .row:active,.disclosure:active { background:var(--pressed); }
    .bottom-nav { display:grid; grid-template-columns:repeat(3,1fr); padding:8px 10px max(8px,env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
    .nav { min-height:54px; border:0; background:transparent; color:var(--muted); display:grid; place-items:center; gap:2px; font-size:13px; }
    .nav[aria-current="page"] { color:var(--brand); font-weight:700; }
    .search { display:grid; gap:7px; margin-top:20px; }
    .search label { color:var(--muted); font-size:13px; }
    .search input,.rename-input { width:100%; border:1px solid var(--line); border-radius:12px; padding:0 14px; background:var(--surface); color:var(--text); }
    .result-count { margin-top:10px; color:var(--muted); font-size:13px; }
    .card-list { display:grid; gap:12px; margin-top:16px; }
    .card { overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--surface); }
    .disclosure { width:100%; min-height:78px; padding:14px 16px; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; text-align:left; }
    .disclosure[aria-expanded="true"] .chevron { transform:rotate(180deg); }
    .expanded { padding:0 16px 16px; border-top:1px solid var(--line); }
    .preview { padding:14px 0; color:var(--muted); font-size:14px; line-height:1.55; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .secondary { min-height:48px; border:1px solid var(--line); border-radius:10px; padding:0 10px; font-weight:700; }
    .secondary.strong { color:var(--brand); border-color:var(--brand); }
    .quiz-card { padding:16px; border:1px solid var(--line); border-radius:14px; background:var(--quiet); }
    .quiz-actions { display:flex; justify-content:space-between; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
    .quiz-actions .secondary { flex:1; }
    .rename { display:grid; gap:10px; }
    .rename-actions { display:flex; justify-content:flex-end; gap:8px; }
    .rename-actions .secondary { min-width:76px; }
    .pagination { min-height:54px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin-top:16px; color:var(--muted); }
    .page-button:first-child { justify-self:start; } .page-button:last-child { justify-self:end; }
    .page-button:disabled { color:var(--subtle); cursor:default; }
    .live { min-height:22px; margin-top:14px; color:var(--muted); font-size:13px; }
    .hidden { display:none !important; }
    @media (max-width:420px) { .prototype{padding:0}.note{padding:12px 16px}.phone{min-height:100dvh;border:0;border-radius:0} main{padding:20px 18px 40px} }
    @media (max-width:340px),(prefers-reduced-motion:reduce) { .actions{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="prototype">
    <p class="note">비생산 UX 검토용입니다. 메인의 전체 보기, 학습자료 펼치기, 퀴즈 이름 변경을 직접 눌러 보세요.</p>
    <div class="phone">
      <main id="app"></main>
      <nav class="bottom-nav" id="bottomNav" aria-label="주요 메뉴">
        <button class="nav" type="button">⌂<span>홈</span></button>
        <button class="nav" type="button" aria-current="page">●<span>학습</span></button>
        <button class="nav" type="button">○<span>프로필</span></button>
      </nav>
    </div>
  </div>
  <script>
    const app = document.getElementById('app');
    const bottomNav = document.getElementById('bottomNav');
    let screen = 'main';
    let materialQuery = '';
    let quizQuery = '';
    const openMaterials = new Set(['material-1']);
    let editingQuiz = null;
    const materials = [
      { id:'material-1', title:'운영체제 정리', meta:'직접 입력 · 오늘 수정', preview:'프로세스와 스케줄링, 교착 상태를 정리한 학습자료예요.', count:'3,240자' },
      { id:'material-2', title:'자료구조 핵심 개념', meta:'Notion에서 가져옴 · 어제 수정', preview:'스택, 큐, 트리의 핵심 개념과 예시를 담았어요.', count:'2,180자' },
      { id:'material-3', title:'네트워크 기초', meta:'문제 생성 중 · 본문 임시 잠금', preview:'TCP/IP와 HTTP 동작 원리를 정리했어요.', count:'4,012자' },
    ];
    const quizzes = [
      { id:'quiz-1', title:'프로세스 스케줄링 퀴즈', material:'운영체제 정리', meta:'10문제 · 오늘 풀이', action:'결과 보기' },
      { id:'quiz-2', title:'스택과 큐 복습', material:'자료구조 핵심 개념', meta:'8문제 · 풀기 전', action:'퀴즈 풀기' },
      { id:'quiz-3', title:'TCP/IP 기본 퀴즈', material:'네트워크 기초', meta:'문제 생성 중', action:'상태 확인' },
    ];
    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function announce(message) { const live=document.getElementById('live'); if(live) live.textContent=message; }
    function mainRow(item, type) {
      return `<li><button class="row" type="button" data-direct="${type}" data-id="${item.id}"><span><span class="title">${escapeHtml(item.title)}</span><span class="meta">${escapeHtml(type==='material'?item.meta:item.material+' · '+item.meta)}</span></span><span class="chevron" aria-hidden="true">›</span></button></li>`;
    }
    function renderMain() {
      bottomNav.classList.remove('hidden');
      app.innerHTML = `<h1>학습</h1>
        <section class="section" aria-labelledby="recent"><div class="section-head"><h2 id="recent">최근 퀴즈</h2></div>
          <div class="recent"><p class="title">프로세스 스케줄링 퀴즈</p><p class="meta">운영체제 정리 · 10문제 · 2회차</p>
            <button class="recent-action" type="button" data-message="틀린 문제 3개 풀이로 이동해요."><span>틀린 문제 3개 풀기</span><span class="chevron" aria-hidden="true">›</span></button></div></section>
        <section class="section"><button class="primary" type="button" data-message="새 문제 만들기 화면으로 이동해요.">새 문제 만들기</button></section>
        <section class="section" aria-labelledby="materials"><div class="section-head"><h2 id="materials">내 학습자료</h2><button class="text-button" type="button" data-screen="materials" aria-label="내 학습자료 전체 보기">전체 보기</button></div><ul class="list">${materials.slice(0,2).map(i=>mainRow(i,'material')).join('')}</ul></section>
        <section class="section" aria-labelledby="quizzes"><div class="section-head"><h2 id="quizzes">내 퀴즈</h2><button class="text-button" type="button" data-screen="quizzes" aria-label="내 퀴즈 전체 보기">전체 보기</button></div><ul class="list">${quizzes.slice(0,2).map(i=>mainRow(i,'quiz')).join('')}</ul></section>
        <p class="live" id="live" aria-live="polite"></p>`;
    }
    function materialCard(item) {
      const open=openMaterials.has(item.id);
      return `<article class="card"><button class="disclosure" type="button" data-material="${item.id}" aria-expanded="${open}" aria-controls="panel-${item.id}"><span><span class="title">${escapeHtml(item.title)}</span><span class="meta">${escapeHtml(item.meta)}</span></span><span class="chevron" aria-hidden="true">⌄</span></button>
        <div class="expanded ${open?'':'hidden'}" id="panel-${item.id}"><p class="preview">${escapeHtml(item.preview)}<br>${item.count}</p><div class="actions"><button class="secondary strong" type="button" data-message="${escapeHtml(item.title)}로 퀴즈 만들기를 시작해요.">퀴즈 만들기</button><button class="secondary" type="button" data-message="${escapeHtml(item.title)} 변경 화면으로 이동해요.">학습자료 변경</button></div></div></article>`;
    }
    function renderMaterials() {
      bottomNav.classList.add('hidden');
      const q=materialQuery.trim().toLocaleLowerCase('ko-KR');
      const filtered=materials.filter(i=>i.title.toLocaleLowerCase('ko-KR').includes(q));
      app.innerHTML=`<div class="topbar"><button class="icon-button" type="button" data-screen="main" aria-label="학습으로 돌아가기">‹</button><h1>내 학습자료</h1><span></span></div>
        <div class="search"><label for="materialSearch">학습자료 제목 검색</label><input id="materialSearch" type="search" value="${escapeHtml(materialQuery)}" placeholder="제목을 입력하세요"></div>
        <p class="result-count">${filtered.length}개의 학습자료</p><div class="card-list">${filtered.length?filtered.map(materialCard).join(''):'<p class="meta">검색어와 일치하는 학습자료가 없어요.</p>'}</div>
        <nav class="pagination" aria-label="학습자료 페이지"><button class="page-button" disabled>이전</button><span>1 / 1</span><button class="page-button" disabled>다음</button></nav><p class="live" id="live" aria-live="polite"></p>`;
      document.getElementById('materialSearch').addEventListener('input', e=>{ materialQuery=e.target.value; renderMaterials(); });
    }
    function quizCard(item) {
      if(editingQuiz===item.id) return `<article class="quiz-card"><div class="rename"><label class="meta" for="rename-${item.id}">퀴즈 이름</label><input class="rename-input" id="rename-${item.id}" value="${escapeHtml(item.title)}" maxlength="255"><p class="meta">${escapeHtml(item.material)} · ${escapeHtml(item.meta)}</p><div class="rename-actions"><button class="secondary" type="button" data-cancel="${item.id}">취소</button><button class="secondary strong" type="button" data-save="${item.id}">저장</button></div></div></article>`;
      return `<article class="quiz-card"><p class="title">${escapeHtml(item.title)}</p><p class="meta">${escapeHtml(item.material)} · ${escapeHtml(item.meta)}</p><div class="quiz-actions"><button class="secondary" type="button" data-rename="${item.id}">이름 변경</button><button class="secondary strong" type="button" data-message="${escapeHtml(item.action)} 화면으로 이동해요.">${escapeHtml(item.action)}</button></div></article>`;
    }
    function renderQuizzes() {
      bottomNav.classList.add('hidden');
      const q=quizQuery.trim().toLocaleLowerCase('ko-KR');
      const filtered=quizzes.filter(i=>i.title.toLocaleLowerCase('ko-KR').includes(q));
      app.innerHTML=`<div class="topbar"><button class="icon-button" type="button" data-screen="main" aria-label="학습으로 돌아가기">‹</button><h1>내 퀴즈</h1><span></span></div>
        <div class="search"><label for="quizSearch">퀴즈 제목 검색</label><input id="quizSearch" type="search" value="${escapeHtml(quizQuery)}" placeholder="제목을 입력하세요"></div>
        <p class="result-count">${filtered.length}개의 퀴즈</p><div class="card-list">${filtered.length?filtered.map(quizCard).join(''):'<p class="meta">검색어와 일치하는 퀴즈가 없어요.</p>'}</div>
        <nav class="pagination" aria-label="퀴즈 페이지"><button class="page-button" disabled>이전</button><span>1 / 1</span><button class="page-button" disabled>다음</button></nav><p class="live" id="live" aria-live="polite"></p>`;
      document.getElementById('quizSearch').addEventListener('input', e=>{ quizQuery=e.target.value; renderQuizzes(); });
      if(editingQuiz){ requestAnimationFrame(()=>document.getElementById(`rename-${editingQuiz}`)?.focus()); }
    }
    function render(){ screen==='main'?renderMain():screen==='materials'?renderMaterials():renderQuizzes(); }
    document.addEventListener('click', e=>{
      const screenTarget=e.target.closest('[data-screen]');
      if(screenTarget){ screen=screenTarget.dataset.screen; editingQuiz=null; render(); return; }
      const direct=e.target.closest('[data-direct]');
      if(direct){ screen=direct.dataset.direct==='material'?'materials':'quizzes'; if(screen==='materials')openMaterials.add(direct.dataset.id); render(); return; }
      const disclosure=e.target.closest('[data-material]');
      if(disclosure){ const id=disclosure.dataset.material; openMaterials.has(id)?openMaterials.delete(id):openMaterials.add(id); renderMaterials(); document.querySelector(`[data-material="${id}"]`)?.focus(); return; }
      const rename=e.target.closest('[data-rename]');
      if(rename){ editingQuiz=rename.dataset.rename; renderQuizzes(); return; }
      const cancel=e.target.closest('[data-cancel]');
      if(cancel){ editingQuiz=null; renderQuizzes(); document.querySelector(`[data-rename="${cancel.dataset.cancel}"]`)?.focus(); return; }
      const save=e.target.closest('[data-save]');
      if(save){ const input=document.getElementById(`rename-${save.dataset.save}`); const value=input.value.trim(); if(!value){ announce('퀴즈 이름을 입력해 주세요.'); input.focus(); return; } const item=quizzes.find(i=>i.id===save.dataset.save); item.title=value; editingQuiz=null; renderQuizzes(); announce('퀴즈 이름을 변경했어요.'); return; }
      const message=e.target.closest('[data-message]'); if(message)announce(message.dataset.message);
    });
    document.addEventListener('keydown', e=>{
      if(!editingQuiz)return;
      if(e.key==='Escape'){ editingQuiz=null; renderQuizzes(); }
      if(e.key==='Enter'&&e.target.matches('.rename-input')){ e.preventDefault(); document.querySelector(`[data-save="${editingQuiz}"]`)?.click(); }
    });
    render();
  </script>
</body>
</html>
