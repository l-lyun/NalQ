spring.application.name=server
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/openmd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:openmd}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:openmd}
spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

openmd.cors.allowed-origins=${OPENMD_CORS_ALLOWED_ORIGINS:http://localhost:5173}
openmd.auth.browser.allowed-origins=${OPENMD_AUTH_BROWSER_ALLOWED_ORIGINS:http://localhost:5173}
openmd.auth.browser.cookie.name=${OPENMD_AUTH_BROWSER_COOKIE_NAME:__Host-openmd_refresh}
openmd.auth.browser.cookie.secure=${OPENMD_AUTH_BROWSER_COOKIE_SECURE:true}
openmd.auth.browser.cookie.same-site=${OPENMD_AUTH_BROWSER_COOKIE_SAME_SITE:Lax}
openmd.auth.browser.cookie.path=${OPENMD_AUTH_BROWSER_COOKIE_PATH:/}

springdoc.api-docs.enabled=${OPENMD_OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENMD_SWAGGER_UI_ENABLED:false}
springdoc.paths-to-match=/api/v1/**
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true

openmd.auth.access-token-secret=${OPENMD_AUTH_ACCESS_TOKEN_SECRET}
openmd.auth.email-code-hmac-secret=${OPENMD_AUTH_EMAIL_CODE_HMAC_SECRET}
openmd.auth.refresh-token-lifetime=${OPENMD_AUTH_REFRESH_TOKEN_LIFETIME:30d}

openmd.mail.from=${OPENMD_MAIL_FROM:}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}

openmd.notion.enabled=${OPENMD_NOTION_ENABLED:false}
openmd.notion.client-id=${OPENMD_NOTION_CLIENT_ID:}
openmd.notion.client-secret=${OPENMD_NOTION_CLIENT_SECRET:}
openmd.notion.callback-uri=${OPENMD_NOTION_CALLBACK_URI:}
openmd.notion.allowed-return-uris=${OPENMD_NOTION_ALLOWED_RETURN_URIS:http://localhost:5173/learning/import/notion}
openmd.notion.failure-return-uri=${OPENMD_NOTION_FAILURE_RETURN_URI:http://localhost:5173/learning/import/notion}
openmd.notion.api-base-url=${OPENMD_NOTION_API_BASE_URL:https://api.notion.com}
openmd.notion.authorize-url=${OPENMD_NOTION_AUTHORIZE_URL:https://api.notion.com/v1/oauth/authorize}
openmd.notion.api-version=${OPENMD_NOTION_API_VERSION:2026-03-11}
openmd.notion.token-keys=${OPENMD_NOTION_TOKEN_KEYS:}
openmd.notion.write-key-version=${OPENMD_NOTION_WRITE_KEY_VERSION:}

spring.ai.openai.api-key=${OPENAI_API_KEY:no-key-configured}
spring.ai.openai.chat.options.model=${OPENMD_QUIZ_GENERATION_MODEL:gpt-5.6-luna}
spring.ai.openai.chat.options.reasoning-effort=${OPENMD_QUIZ_GENERATION_REASONING_EFFORT:low}
openmd.quiz.generation.model=${OPENMD_QUIZ_GENERATION_MODEL:gpt-5.6-luna}
openmd.quiz.generation.reasoning-effort=${OPENMD_QUIZ_GENERATION_REASONING_EFFORT:low}
openmd.quiz.generation.timeout=${OPENMD_QUIZ_GENERATION_TIMEOUT:60s}
openmd.quiz.generation.network-retry=${OPENMD_QUIZ_GENERATION_NETWORK_RETRY:1}
openmd.quiz.generation.worker-count=${OPENMD_QUIZ_GENERATION_WORKER_COUNT:4}
openmd.quiz.generation.queue-capacity=${OPENMD_QUIZ_GENERATION_QUEUE_CAPACITY:20}
openmd.quiz.generation.stale-execution=${OPENMD_QUIZ_GENERATION_STALE_EXECUTION:10m}
openmd.quiz.generation.prompt-version=${OPENMD_QUIZ_GENERATION_PROMPT_VERSION:quiz-generation-v1}
openmd.quiz.generation.enabled=${OPENMD_QUIZ_GENERATION_ENABLED:false}
