  <text x="739" y="143" text-anchor="end" font-size="13" font-weight="700" fill="#e85d38">모두 읽음</text>
  <line x1="451" y1="166" x2="749" y2="166" class="line"/>

  <rect x="451" y="178" width="298" height="112" rx="8" fill="#fff8f5"/>
  <circle cx="468" cy="202" r="4" fill="#e85d38"/>
