name: Verify

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web_static:
    name: web-static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            app/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Install app dependencies for license verification
        run: pnpm --dir ../app install --frozen-lockfile
      - name: Run web verification
        run: pnpm verify

  server_fast:
    name: server-fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run server fast tests
        run: ./gradlew fastTest --no-daemon
      - name: Upload failed fast-test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-fast-test-reports
          path: server/build/reports/tests/fastTest
          if-no-files-found: ignore
          retention-days: 7

  server_integration:
    name: server-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run server integration tests
        run: ./gradlew integrationTest --no-daemon
      - name: Upload failed integration-test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-integration-test-reports
          path: server/build/reports/tests/integrationTest
          if-no-files-found: ignore
          retention-days: 7

  harness_required:
    name: harness-required
    if: ${{ always() }}
    needs:
      - web_static
      - server_fast
      - server_integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          WEB_STATIC_RESULT: ${{ needs.web_static.result }}
          SERVER_FAST_RESULT: ${{ needs.server_fast.result }}
          SERVER_INTEGRATION_RESULT: ${{ needs.server_integration.result }}
        run: |
          test "$WEB_STATIC_RESULT" = "success"
          test "$SERVER_FAST_RESULT" = "success"
          test "$SERVER_INTEGRATION_RESULT" = "success"
