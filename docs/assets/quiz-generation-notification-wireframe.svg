<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" role="img" aria-labelledby="title desc">
  <title id="title">모바일 퀴즈 생성 결과 알림 UX 와이어프레임</title>
  <desc id="desc">모바일 웹과 WebView에서 다른 화면을 보는 중 Snackbar와 종 배지를 확인하고 모바일 알림함으로 이동하는 흐름을 보여준다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.12"/></filter>
    <style>
      text { font-family: Pretendard, system-ui, sans-serif; fill: #22262b; }
      .heading { font-size: 16px; font-weight: 600; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #747b84; }
      .inverse { fill: #ffffff; }
      .line { stroke: #e1e4e8; stroke-width: 1; }
    </style>
  </defs>

  <rect width="820" height="760" rx="24" fill="#f1f3f5"/>
  <text x="55" y="48" class="heading">1. 다른 화면에서 결과 알림</text>
  <text x="435" y="48" class="heading">2. 모바일 알림함</text>

