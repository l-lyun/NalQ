  <text x="485" y="321" font-size="14" font-weight="700">학습자료에서 문제를</text>
  <text x="485" y="342" font-size="14" font-weight="700">만들지 못했어요.</text>
  <text x="485" y="369" font-size="13">네트워크 기초 개념 정리</text>
  <text x="485" y="395" class="small">8분 전</text>
